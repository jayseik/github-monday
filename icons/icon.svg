<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Calendar body -->
  <rect x="10" y="28" width="108" height="90" rx="10" ry="10" fill="none" stroke="#000" stroke-width="7"/>
  <!-- Calendar header bar -->
  <rect x="10" y="28" width="108" height="28" rx="10" ry="10" fill="#000"/>
  <rect x="10" y="46" width="108" height="10" fill="#000"/>
  <!-- Calendar binding rings -->
  <rect x="36" y="14" width="8" height="26" rx="4" fill="#000"/>
  <rect x="84" y="14" width="8" height="26" rx="4" fill="#000"/>
  <!-- Bold "M" in calendar body -->
  <text x="64" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="800" font-size="52" fill="#000" text-anchor="middle" dominant-baseline="auto">M</text>
</svg>
